[project]
name = "hb-layer1"
version = "0.1.0"
description = "Layer 1 request-shape instrument for harness-bench"
requires-python = ">=3.11"
dependencies = ["tiktoken>=0.7"]

[project.scripts]
hb-collect = "hb_layer1.collect:main"
hb-report = "hb_layer1.report:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hb_layer1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
